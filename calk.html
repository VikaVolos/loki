<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Anime Calculator</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: "Trebuchet MS", sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                linear-gradient(rgba(10,10,30,.6), rgba(10,10,30,.7)),
                url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1400&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            overflow:hidden;
        }

        .calculator{
            width:360px;
            padding:25px;
            border-radius:28px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(14px);
            border:1px solid rgba(255,255,255,0.2);

            box-shadow:
                0 0 25px rgba(0,255,255,0.3),
                0 0 50px rgba(255,0,255,0.2);
        }

        .title{
            text-align:center;
            color:white;
            font-size:30px;
            margin-bottom:20px;
            text-shadow:0 0 12px #ff66ff;
        }

        #display{
            width:100%;
            height:75px;
            border:none;
            outline:none;
            border-radius:18px;
            margin-bottom:20px;
            padding:15px;
            font-size:34px;
            text-align:right;
            color:white;
            background: rgba(255,255,255,0.12);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
        }

        .buttons{
            display:grid;
            grid-template-columns: repeat(4, 1fr);
            gap:12px;
        }

        button{
            height:68px;
            border:none;
            border-radius:18px;
            font-size:22px;
            color:white;
            cursor:pointer;
            transition:0.2s;
            background: rgba(255,255,255,0.12);
        }

        button:hover{
            transform:scale(1.07);
            background: rgba(255,255,255,0.22);
        }

        .operator{
            background: linear-gradient(45deg, #ff00cc, #7b2ff7);
        }

        .equal{
            background: linear-gradient(45deg, #00c6ff, #0072ff);
        }

        .clear{
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }

        .footer{
            margin-top:15px;
            text-align:center;
            color:white;
            font-size:14px;
            text-shadow:0 0 10px cyan;
        }
    </style>
</head>
<body>

<div class="calculator">

    <div class="title">✨ Anime Calc ✨</div>

    <input type="text" id="display" disabled>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        <button class="operator" onclick="appendValue('*')">×</button>
        <button class="operator" onclick="deleteLast()">⌫</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>

        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
        <button onclick="appendValue('%')">%</button>

    </div>

    <div class="footer">
        🌸 kawaii mode activated 🌸
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
